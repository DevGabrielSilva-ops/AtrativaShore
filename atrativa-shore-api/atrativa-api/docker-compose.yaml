services:
  mysql:
    image: mysql:8.4
    container_name: atrativa-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: atrativaLoja
      MYSQL_USER: atrativa
      MYSQL_PASSWORD: admin

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: